name: Request frame modes comparison
on:
  push:
    branches: [codex/request-frame-modes-performance-20261029]
  workflow_dispatch:
concurrency:
  group: request-frame-modes-comparison
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'poorbarcode/pulsar'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: |
            17
            25
      - uses: ./.github/actions/setup-gradle
        with:
          cache-read-only: false
      - name: Build both images on one native amd64 host
        run: python3 .github/scripts/request-frame-modes-comparison.py prepare
      - name: Verify OpenTelemetry collection on both revisions
        run: python3 .github/scripts/request-frame-modes-comparison.py verify-metrics
      - name: Compare fixed-small - three rounds of all modes
        run: python3 .github/scripts/request-frame-modes-comparison.py fixed-small
      - name: Preserve fixed-small checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: request-frame-modes-comparison-fixed-small
          path: ${{ runner.temp }}/request-frame-modes-comparison
          retention-days: 7
          if-no-files-found: error
      - name: Compare fixed-large - three rounds of all modes
        run: python3 .github/scripts/request-frame-modes-comparison.py fixed-large
      - name: Preserve fixed-large checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: request-frame-modes-comparison-fixed-large
          path: ${{ runner.temp }}/request-frame-modes-comparison
          retention-days: 7
          if-no-files-found: error
      - name: Compare max-small - three rounds of all modes
        run: python3 .github/scripts/request-frame-modes-comparison.py max-small
      - name: Preserve max-small checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: request-frame-modes-comparison-max-small
          path: ${{ runner.temp }}/request-frame-modes-comparison
          retention-days: 7
          if-no-files-found: error
      - name: Compare max-large - three rounds of all modes
        run: python3 .github/scripts/request-frame-modes-comparison.py max-large
      - name: Preserve max-large checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: request-frame-modes-comparison-max-large
          path: ${{ runner.temp }}/request-frame-modes-comparison
          retention-days: 7
          if-no-files-found: error
      - name: Upload all results and reproducibility metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-frame-modes-comparison
          path: ${{ runner.temp }}/request-frame-modes-comparison
          retention-days: 30
          if-no-files-found: error
