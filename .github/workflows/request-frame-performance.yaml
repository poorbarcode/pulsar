name: Request frame memory performance
on:
  push:
    branches: [codex/request-frame-memory-performance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'poorbarcode/pulsar'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: |
            17
            25
      - uses: ./.github/actions/setup-gradle
        with:
          cache-read-only: false
      - name: Build and compare on one native Linux amd64 runner
        run: python3 .github/scripts/request-frame-performance.py
      - name: Upload reproducible measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-frame-performance
          path: ${{ runner.temp }}/request-frame-results
          retention-days: 30
          if-no-files-found: error
